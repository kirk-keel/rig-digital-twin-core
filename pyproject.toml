[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-digital-twin-core"
version = "0.1.0"
description = "Real-time petroleum digital twin coupling deterministic wellbore physics with ML state estimators"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Rig Digital Twin Core Team"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.scripts]
rig-twin = "rig_twin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rig_twin*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

