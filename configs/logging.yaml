version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] [%(name)s]: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    format: '{"time": "%(asctime)s", "level": "%(levelname)s", "module": "%(name)s", "message": "%(message)s"}'
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: "rig_twin.log"
    maxBytes: 10485760  # 10 MB
    backupCount: 5
    encoding: utf8
loggers:
  rig_twin:
    level: DEBUG
    handlers: [console]
    propagate: false
root:
  level: INFO
  handlers: [console]
